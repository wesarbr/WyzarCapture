[package]
name = "wyzar-capture"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
description = "Captura e edição de vídeo nativas para Windows"
build = "build.rs"
default-run = "WyzarCapture"

[[bin]]
name = "WyzarCapture"
path = "src/main.rs"

[[bin]]
name = "assetgen"
path = "tools/assetgen.rs"

[[bin]]
name = "WyzarCaptureSetup"
path = "src/setup_main.rs"

[features]
default = []
# Development certification only; never enabled in the beta release pipeline.
experimental-all-users = []

[dependencies]
# COM provider implementations require a direct name for this existing Microsoft
# binding. Exact same version already present in vendor and Cargo.lock; no download.
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
windows = { version = "=0.61.3", features = [
  "Foundation", "Foundation_Collections", "Foundation_Numerics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
  "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_MediaFoundation", "Win32_Media_Multimedia",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole",
  "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_WinRT",
  "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Time", "Win32_System_IO",
  "Win32_System_ProcessStatus", "Win32_System_Threading",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
incremental = false

[profile.test]
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
