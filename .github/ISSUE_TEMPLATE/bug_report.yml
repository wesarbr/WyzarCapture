name: Bug report
description: Report a reproducible problem without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "This is a public bug report when the repository is public. For vulnerabilities, read SECURITY.md instead. Use text and synthetic examples; do not upload executables, scripts, archives, full logs or private media."
  - type: checkboxes
    id: safe_report
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Issues and read SUPPORT.md.
          required: true
        - label: This is not a confidential vulnerability report, and I removed private data and credentials.
          required: true
  - type: input
    id: version
    attributes:
      label: WyzarCapture version
      placeholder: "0.7.0 Beta"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows edition, version and build
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Application language
      options:
        - Brazilian Portuguese
        - English
        - Spanish
        - Simplified Chinese
        - Japanese
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Include selected capture/audio mode and whether a short test with a writable local media folder also fails.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant hardware, error codes and safe evidence
      description: Use text for GPU/camera model and numeric error codes. Use synthetic content and remove private information; do not attach executable files, scripts or archives.
